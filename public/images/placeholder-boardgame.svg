<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Imagem padrão de jogo sem foto: peça de terreno com torre, meeple e dado sob um arco de pedra.
       Sem tamanho próprio: ocupa a <img> inteira e recorta como object-fit: cover.
       Em caixas pequenas o traço engrossa; nas quadradas o arco sai e o desenho se aproxima. -->
  <style>
    .art { transform-origin: 400px 311px; transition: transform .35s ease; }
    .line, .detail-line { transition: stroke-width .35s ease; }
    .backdrop, .detail { transition: opacity .3s ease; }
    @media (max-width: 300px) {
      .line { stroke-width: 5.5; }
      .detail-line { stroke-width: 3.6; }
    }
    @media (max-aspect-ratio: 5/4) {
      .art { transform: scale(1.3); }
      .line { stroke-width: 5.5; }
      .detail-line { stroke-width: 3.6; }
      .backdrop { opacity: 0; }
    }
    @media (max-width: 80px) {
      .art { transform: scale(1.45); }
      .line { stroke-width: 9; }
      .detail-line { stroke-width: 6; }
      .detail { opacity: 0; }
    }
  </style>
  <svg width="100%" height="100%" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
    <defs>
    <radialGradient id="bg" cx="400" cy="290" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e1a15"/>
      <stop offset="1" stop-color="#0f0e0c"/>
    </radialGradient>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M3.5 0V7" stroke="#e6c56b" stroke-width="1.6"/>
    </pattern>
    <pattern id="hatchBack" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <path d="M3.5 0V7" stroke="#e6c56b" stroke-width="1.4"/>
    </pattern>
    <pattern id="hatchFlat" width="7" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 3H7" stroke="#e6c56b" stroke-width="1.4"/>
    </pattern>
    <radialGradient id="groundFade" cx=".5" cy=".5" r=".5">
      <stop offset=".3" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="groundMask" maskContentUnits="objectBoundingBox">
      <rect width="1" height="1" fill="url(#groundFade)"/>
    </mask>
    <radialGradient id="candleGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e6c56b" stop-opacity=".28"/>
      <stop offset="1" stop-color="#e6c56b" stop-opacity="0"/>
    </radialGradient>
    </defs>
    <rect width="800" height="600" fill="url(#bg)"/>
    <g class="art">
    <g class="backdrop" opacity="0.34">
      
        <clipPath id="c0"><path d="M196 462L196 300A214 214 0 0 1 400 86.23A214 214 0 0 1 604 300L604 462L588 462L588 300A198 198 0 0 0 400 102.25A198 198 0 0 0 212 300L212 462Z"/></clipPath>
