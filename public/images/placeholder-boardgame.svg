        <path d="M212 462L212 300A198 198 0 0 1 400 102.25A198 198 0 0 1 588 300L588 462"/>
        <path d="M218.35 250.25L202.87 246.22M581.65 250.25L597.13 246.22M237.01 203.68L223.03 195.9M562.99 203.68L576.97 195.9M266.76 163.3L255.18 152.26M533.24 163.3L544.82 152.26M305.71 131.69L297.28 118.09M494.29 131.69L502.72 118.09M351.34 110.89L346.6 95.61M448.66 110.89L453.4 95.61M196 334L212 334M588 334L604 334M196 370L212 370M588 370L604 370M196 406L212 406M588 406L604 406M196 442L212 442M588 442L604 442"/>
