<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Ilustração padrão (Pizzas) para itens sem foto. Sem tamanho próprio: ocupa a <img>
       inteira e o desenho fica centralizado, sem corte. O traço afina nas caixas grandes. -->
  <style>
    .l { fill: none; stroke: #e6c56b; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
    .f { fill: #e6c56b; }
    @media (max-width: 72px), (max-height: 72px) { .l { stroke-width: 2.8; } }
    @media (min-width: 200px) and (min-height: 200px) { .l { stroke-width: 1.7; } }
    @media (min-width: 360px) and (min-height: 360px) { .l { stroke-width: 1.3; } }
  </style>
  <svg width="100%" height="100%" viewBox="0 0 120 120" preserveAspectRatio="xMidYMid meet">
    <g class="l">
      <path d="M32 36 Q60 20 88 36 L60 100 Z"/>
      <path d="M34.6 42 Q60 28 85.4 42"/>
      <circle cx="51" cy="53" r="5"/>
      <circle cx="68" cy="57" r="4.5"/>
      <circle cx="59" cy="73" r="4"/>
      <path d="M43 62 Q44 66 42.6 69"/>
    </g>
  </svg>
</svg>
